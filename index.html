<!DOCTYPE html>
<html lang="es" manifest="psfree_lapse.cache">
<head>
<meta charset="utf-8">
<title>AJ PSFree 1.5.0b - PS4 9.00</title>
<script>
if (window.applicationCache.status == 0) {
  window.location.replace("cache.html");
}
</script>
<style>
  :root {
    --accent: #00f0ff;
    --secondary: #ff2a6d;
    --bg: #0a0a1a;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* Gradiente animado sutil */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a1a2e);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    pointer-events: none;
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .hidden { display: none !important; }

  /* ---------- MENÚ ---------- */
  #menu h1 {
    font-size: 2.5rem;
    font-weight: bold;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent);
    margin-bottom: 0.5rem;
  }
  #menu p {
    font-size: 1.2rem;
    color: #ccc;
    margin-bottom: 30px;
  }
  #autoToggle {
    margin: 20px 0;
    font-size: 1rem;
    color: #ccc;
  }
  #autoToggle input {
    margin-right: 8px;
  }
  #activateBtn {
    padding: 18px 50px;
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--secondary));
    border: none;
    border-radius: 60px;
    cursor: pointer;
    box-shadow: 0 0 30px var(--accent);
    animation: pulse 2s infinite;
    transition: transform 0.2s;
  }
  #activateBtn:active {
    transform: scale(0.95);
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 30px var(--accent); }
    50%  { box-shadow: 0 0 60px var(--accent); }
    100% { box-shadow: 0 0 30px var(--accent); }
  }

  /* Botón instalar caché */
  .cache-btn {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 0.9rem;
    color: var(--accent);
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--accent);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .cache-btn:hover {
    background: rgba(0, 240, 255, 0.2);
  }

  /* Estado de caché */
  #cacheStatus {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #888;
  }

  /* Redes sociales */
  .social-links {
    margin-top: 30px;
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .social-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #ccc;
    text-decoration: none;
    font-size: 0.8rem;
    transition: color 0.3s, transform 0.3s;
  }
  .social-link:hover {
    color: var(--accent);
    transform: translateY(-2px);
  }
  .social-link svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* Créditos */
  .credits {
    margin-top: 20px;
    font-size: 0.65rem;
    color: #555;
  }

  /* ---------- PANTALLA DE CARGA ---------- */
  #loading h2 {
    font-size: 1.8rem;
    color: var(--accent);
    text-shadow: 0 0 15px var(--accent);
    margin-bottom: 20px;
  }
  #progressContainer {
    width: 80%;
    max-width: 500px;
    margin: 20px auto;
  }
  #progressBar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  #progressBar::after {
    content: '';
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    border-radius: 4px;
    animation: indeterminate 1.2s infinite;
  }
  @keyframes indeterminate {
    0%   { left: -50%; }
    100% { left: 100%; }
  }
  #status {
    font-size: 1rem;
    color: #ccc;
    margin: 10px 0;
  }
  #console {
    width: 80%;
    max-width: 600px;
    height: 200px;
    margin: 20px auto;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    text-align: left;
    color: #00ff88;
    white-space: pre-wrap;
  }
  .retry-btn {
    margin-top: 10px;
    padding: 10px 20px;
    background: var(--secondary);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- MENÚ PRINCIPAL -->
    <div id="menu">
      <h1>AJ PSFree 1.5.0b</h1>
      <p>PS4 9.00</p>
      <div id="autoToggle">
        <label>
          <input type="checkbox" id="autoCheckbox" checked> Auto-activar en 10s
        </label>
      </div>
      <button id="activateBtn">ACTIVAR GOLDHEN</button>
      <button class="cache-btn" onclick="window.location.href='cache.html'">Instalar caché (para usarse sin internet)</button>
      <div id="cacheStatus"></div>

      <div class="social-links">
        <a class="social-link" href="https://www.youtube.com/@Oficial-AJ" target="_blank">
          <svg viewBox="0 0 24 24"><path d="M23 12s0-3.2-.4-4.7c-.2-.8-.9-1.5-1.7-1.7C19.4 5 12 5 12 5s-7.4 0-8.9.6c-.8.2-1.5.9-1.7 1.7C1 8.8 1 12 1 12s0 3.2.4 4.7c.2.8.9 1.5 1.7 1.7 1.5.6 8.9.6 8.9.6s7.4 0 8.9-.6c.8-.2 1.5-.9 1.7-1.7.4-1.5.4-4.7.4-4.7zM9.8 15.5V8.5l6.2 3.5-6.2 3.5z"/></svg>
          YouTube
        </a>
        <a class="social-link" href="https://www.tiktok.com/@ajk.al" target="_blank">
          <svg viewBox="0 0 24 24"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.5-4.2V2h-3.3v11.5a2.8 2.8 0 1 1-2-2.7V7.5a6.2 6.2 0 1 0 6.2 6.2V8.6a7.9 7.9 0 0 0 4.6 1.5V6.8h-2z"/></svg>
          TikTok
        </a>
        <a class="social-link" href="https://ajfiles.github.io/files/" target="_blank">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm7.9 6h-4.1c-.4-1.7-1.1-3.4-2-4.9A7.9 7.9 0 0 1 19.9 8zM12 4c1.1 1.4 1.9 3 2.3 4H9.7c.4-1 1.2-2.6 2.3-4zM4.3 10H8c.1 1 .3 1.9.5 2.8H4.1a8 8 0 0 1 0-2.8h.2zm1.6-2h3.9c.3-1.3.7-2.6 1.3-3.7A7.9 7.9 0 0 1 5.9 8zM5.9 16h3.9c-.6-1.1-1-2.4-1.3-3.7H4.8a8 8 0 0 0 1.1 3.7zm2.2 2c.8 1.3 1.7 2.4 2.9 3.3A8 8 0 0 1 8.1 18zm2-3.2c-.2-.9-.4-1.9-.5-2.8h4.8c-.1 1-.3 1.9-.5 2.8a18 18 0 0 1-1.9 4.9 18 18 0 0 1-1.9-4.9zm4.8-8.6h3.9a8 8 0 0 1 1.1 3.7h-3.7c-.3-1.3-.7-2.6-1.3-3.7zm1 5.7c.2.9.4 1.9.5 2.8h3.9a8 8 0 0 0 0-2.8h-4.4z"/></svg>
          Web
        </a>
      </div>
      <div class="credits">Gracias a PSFree, Kameleon, Sleirsgoevy y todos los desarrolladores</div>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading" class="hidden">
      <h2>Ejecutando exploit...</h2>
      <div id="progressContainer">
        <div id="progressBar"></div>
      </div>
      <div id="status">Preparando...</div>
      <pre id="console"></pre>
    </div>
  </div>

  <script>
    // ---------- ESTADO DE CACHÉ ----------
    function updateCacheStatus() {
      const status = window.applicationCache.status;
      const el = document.getElementById('cacheStatus');
      if (status === 1) {
        el.textContent = 'Caché: Activada';
      } else if (status === 0) {
        el.textContent = 'Caché: No activada (instalar)';
      } else {
        el.textContent = 'Caché: Estado ' + status;
      }
    }
    updateCacheStatus();
    window.applicationCache.addEventListener('updateready', updateCacheStatus);
    window.applicationCache.addEventListener('cached', updateCacheStatus);

    // ---------- SONIDO DE ÉXITO ----------
    function playSuccessSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gainNode.gain.value = 0.3;
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        setTimeout(() => {
          oscillator.stop();
          audioCtx.close();
        }, 300);
      } catch(e) {
        // silencioso si no soportado
      }
    }

    // ---------- LÓGICA DE ACTIVACIÓN ----------
    const menu = document.getElementById('menu');
    const loading = document.getElementById('loading');
    const statusDiv = document.getElementById('status');
    const consoleEl = document.getElementById('console');
    const activateBtn = document.getElementById('activateBtn');
    const autoCheckbox = document.getElementById('autoCheckbox');

    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      consoleEl.textContent += args.join(' ') + '\n';
      consoleEl.scrollTop = consoleEl.scrollHeight;
    };

    let countdownTimer = null;

    function startCountdown(seconds) {
      let remaining = seconds;
      activateBtn.disabled = true;
      activateBtn.textContent = `Activando en ${remaining}s...`;
      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          activateBtn.textContent = `Activando en ${remaining}s...`;
        } else {
          clearInterval(countdownTimer);
          activateBtn.disabled = false;
          activateBtn.textContent = 'ACTIVAR GOLDHEN';
          activateBtn.click();
        }
      }, 1000);
    }

    const savedAuto = localStorage.getItem('autoActivate');
    if (savedAuto === null || savedAuto === 'true') {
      autoCheckbox.checked = true;
      startCountdown(10);
    } else {
      autoCheckbox.checked = false;
    }

    autoCheckbox.addEventListener('change', () => {
      if (autoCheckbox.checked) {
        localStorage.setItem('autoActivate', 'true');
        startCountdown(10);
      } else {
        localStorage.setItem('autoActivate', 'false');
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        activateBtn.disabled = false;
        activateBtn.textContent = 'ACTIVAR GOLDHEN';
      }
    });

    activateBtn.addEventListener('click', () => {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      menu.classList.add('hidden');
      loading.classList.remove('hidden');
      statusDiv.textContent = 'Ejecutando exploit...';
      consoleEl.textContent = '';

      console.log('Iniciando PSFree-Lapse...');

      import('./alert.mjs').then(({ startExploit }) => {
        return startExploit();
      }).then(() => {
        statusDiv.textContent = 'GoldHEN cargado correctamente';
        console.log('GoldHEN activado');
        playSuccessSound();
      }).catch(err => {
        statusDiv.innerHTML = 'Error: ' + err + '<br><button class="retry-btn" onclick="location.reload()">Reintentar</button>';
        console.log('Error: ' + err);
      });
    });
  </script>
</body>
</html>
