<!DOCTYPE html>
<html lang="es" manifest="psfree_lapse.cache">
<head>
<meta charset="utf-8">
<title>AJ PSFree 1.5.0b - PS4 9.00</title>
<style>
  :root {
    --accent: #00f0ff;
    --secondary: #ff2a6d;
    --bg: #0a0a1a;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #backgroundCanvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    width: 100%;
  }
  .hidden { display: none !important; }

  /* ---------- MENÚ ---------- */
  #menu h1 {
    font-size: 2.5rem;
    font-weight: bold;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent);
    margin-bottom: 0.5rem;
  }
  #menu p {
    font-size: 1.2rem;
    color: #ccc;
    margin-bottom: 30px;
  }
  #autoToggle {
    margin: 20px 0;
    font-size: 1rem;
    color: #ccc;
  }
  #autoToggle input {
    margin-right: 8px;
  }
  #activateBtn {
    padding: 18px 50px;
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--secondary));
    border: none;
    border-radius: 60px;
    cursor: pointer;
    box-shadow: 0 0 30px var(--accent);
    animation: pulse 2s infinite;
    transition: transform 0.2s;
  }
  #activateBtn:active {
    transform: scale(0.95);
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 30px var(--accent); }
    50%  { box-shadow: 0 0 60px var(--accent); }
    100% { box-shadow: 0 0 30px var(--accent); }
  }

  /* ---------- PANTALLA DE CARGA ---------- */
  #loading h2 {
    font-size: 1.8rem;
    color: var(--accent);
    text-shadow: 0 0 15px var(--accent);
    margin-bottom: 20px;
  }
  #progressContainer {
    width: 80%;
    max-width: 500px;
    margin: 20px auto;
  }
  #progressBar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  #progressBar::after {
    content: '';
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    border-radius: 4px;
    animation: indeterminate 1.2s infinite;
  }
  @keyframes indeterminate {
    0%   { left: -50%; }
    100% { left: 100%; }
  }
  #status {
    font-size: 1rem;
    color: #ccc;
    margin: 10px 0;
  }
  #console {
    width: 80%;
    max-width: 600px;
    height: 200px;
    margin: 20px auto;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    text-align: left;
    color: #00ff88;
    white-space: pre-wrap;
  }
  .retry-btn {
    margin-top: 10px;
    padding: 10px 20px;
    background: var(--secondary);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>

  <div class="container">
    <!-- MENÚ PRINCIPAL -->
    <div id="menu">
      <h1>AJ PSFree 1.5.0b</h1>
      <p>PS4 9.00</p>
      <div id="autoToggle">
        <label>
          <input type="checkbox" id="autoCheckbox" checked> Auto-activar en 10s
        </label>
      </div>
      <button id="activateBtn">ACTIVAR GOLDHEN</button>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading" class="hidden">
      <h2>Ejecutando exploit...</h2>
      <div id="progressContainer">
        <div id="progressBar"></div>
      </div>
      <div id="status">Preparando...</div>
      <pre id="console"></pre>
    </div>
  </div>

  <script>
    // ---------- PARTÍCULAS LIGERAS (canvas) ----------
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const NUM_PARTICLES = 8;
    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: 2 + Math.random() * 3
      });
    }

    let animId = null;
    function drawParticles() {
      if (!document.getElementById('loading').classList.contains('hidden')) {
        // Detener partículas si la pantalla de carga está visible
        animId = requestAnimationFrame(drawParticles);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,240,255,0.7)';
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      }
      animId = requestAnimationFrame(drawParticles);
    }
    drawParticles();
  </script>

  <script type="module">
    import { startExploit } from './alert.mjs';

    const menu = document.getElementById('menu');
    const loading = document.getElementById('loading');
    const statusDiv = document.getElementById('status');
    const consoleEl = document.getElementById('console');
    const activateBtn = document.getElementById('activateBtn');
    const autoCheckbox = document.getElementById('autoCheckbox');

    // Redirigir console.log al div de consola
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      consoleEl.textContent += args.join(' ') + '\n';
      consoleEl.scrollTop = consoleEl.scrollHeight;
    };

    // Manejar autoactivación
    let countdownTimer = null;

    function startCountdown(seconds) {
      let remaining = seconds;
      activateBtn.disabled = true;
      activateBtn.textContent = `Activando en ${remaining}s...`;
      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          activateBtn.textContent = `Activando en ${remaining}s...`;
        } else {
          clearInterval(countdownTimer);
          activateBtn.disabled = false;
          activateBtn.textContent = 'ACTIVAR GOLDHEN';
          activateBtn.click();
        }
      }, 1000);
    }

    // Al cargar, restaurar preferencia (por defecto marcado)
    const savedAuto = localStorage.getItem('autoActivate');
    if (savedAuto === null || savedAuto === 'true') {
      autoCheckbox.checked = true;
      startCountdown(10);
    } else {
      autoCheckbox.checked = false;
    }

    autoCheckbox.addEventListener('change', () => {
      if (autoCheckbox.checked) {
        localStorage.setItem('autoActivate', 'true');
        startCountdown(10);
      } else {
        localStorage.setItem('autoActivate', 'false');
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        activateBtn.disabled = false;
        activateBtn.textContent = 'ACTIVAR GOLDHEN';
      }
    });

    // Acción de activar
    activateBtn.addEventListener('click', () => {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      menu.classList.add('hidden');
      loading.classList.remove('hidden');
      statusDiv.textContent = 'Ejecutando exploit...';
      consoleEl.textContent = '';

      console.log('Iniciando PSFree-Lapse...');

      startExploit().then(() => {
        statusDiv.textContent = 'GoldHEN cargado correctamente';
        console.log('GoldHEN activado');
      }).catch(err => {
        statusDiv.innerHTML = 'Error: ' + err + '<br><button class="retry-btn" onclick="location.reload()">Reintentar</button>';
        console.log('Error: ' + err);
      });
    });
  </script>
</body>
</html>
