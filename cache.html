<html manifest="psfree_lapse.cache">
<head>
<title>AJ PSFree 1.5.0b - PS4 9.00</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a1a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .info { text-align: center; }
  .progress {
    width: 320px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
    margin: 20px auto;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f0ff, #ff2a6d);
    transition: width 0.3s;
  }
  #percent { font-size: 2rem; }
  #msgs { color: #ccc; }
</style>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){
  Percent=(Math.round(e.loaded / e.total * 100));
  document.getElementById('percent').textContent=Percent+"%";
  document.getElementById('fill').style.width=Percent+"%";
}
function DisplayCacheProgress(){
  setTimeout(function(){document.getElementById('msgs').innerHTML="Cache Instalada Correctamente";},2000);
  setTimeout(function(){location.reload();},3000);
}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
</head>
<body>
<div class="info">
  <h2>AJ PSFree 1.5.0b - PS4 9.00</h2>
  <div class="progress"><div class="progress-fill" id="fill"></div></div>
  <div id="percent">0%</div>
  <div id="msgs">Descargando...</div>
</div>
</body>
</html>
